<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Primer ABC — Acceso</title>

    <link rel="stylesheet" href="css/design-system.css" />

    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--color-bg);
        }

        /* ---- Panel izquierdo: ilustración / marca ---- */
        .login-hero {
            background: var(--color-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-12);
            gap: var(--space-8);
            position: relative;
            overflow: hidden;
        }

        /* Círculos decorativos con los colores de grado */
        .login-hero::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            top: -120px;
            left: -120px;
        }

        .login-hero::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            bottom: -80px;
            right: -80px;
        }

        .hero-bubbles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hero-bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
        }

        .hero-bubble-1 {
            width: 80px;
            height: 80px;
            background: var(--color-maternal);
            top: 15%;
            right: 15%;
        }

        .hero-bubble-2 {
            width: 50px;
            height: 50px;
            background: var(--color-kinder1);
            top: 60%;
            right: 25%;
        }

        .hero-bubble-3 {
            width: 60px;
            height: 60px;
            background: var(--color-kinder2);
            bottom: 20%;
            left: 20%;
        }

        .hero-bubble-4 {
            width: 40px;
            height: 40px;
            background: var(--color-kinder3);
            top: 35%;
            left: 10%;
        }

        .hero-logo-wrapper {
            position: relative;
            z-index: 1;
        }

        .hero-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: var(--radius-xl);
            background: white;
            padding: var(--space-3);
            box-shadow: var(--shadow-xl);
        }

        .hero-logo-placeholder {
            width: 140px;
            height: 140px;
            border-radius: var(--radius-xl);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-xl);
            font-family: var(--font-heading);
            font-weight: var(--font-extrabold);
            font-size: 3rem;
            color: var(--color-primary);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: var(--text-3xl);
            font-weight: var(--font-extrabold);
            line-height: 1.1;
            margin-bottom: var(--space-3);
        }

        .hero-subtitle {
            font-size: var(--text-base);
            opacity: 0.85;
            line-height: 1.6;
            max-width: 300px;
        }

        .hero-grades {
            display: flex;
            gap: var(--space-3);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hero-grade-pill {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--font-bold);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
        }

        .hero-grade-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* ---- Panel derecho: formulario ---- */
        .login-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-12);
            background: var(--color-surface);
        }

        .login-form-container {
            width: 100%;
            max-width: 400px;
        }

        .login-form-header {
            margin-bottom: var(--space-8);
        }

        .login-form-title {
            font-family: var(--font-heading);
            font-size: var(--text-2xl);
            font-weight: var(--font-extrabold);
            color: var(--color-text-primary);
            margin-bottom: var(--space-2);
        }

        .login-form-subtitle {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .form-label {
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            color: var(--color-text-secondary);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: var(--space-4) var(--space-4) var(--space-4) calc(var(--space-4) + 1.5rem + var(--space-3));
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: var(--text-base);
            color: var(--color-text-primary);
            background-color: var(--color-bg);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .form-control::placeholder {
            color: var(--color-text-muted);
        }

        .form-control:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(46, 158, 91, 0.12);
            background: white;
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: var(--space-4);
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: var(--text-base);
            font-weight: var(--font-bold);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        .btn-login:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(46, 158, 91, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            background: #FFEBEE;
            border: 1px solid #FFCDD2;
            color: var(--color-error);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            display: none;
            align-items: center;
            gap: var(--space-2);
        }

        .login-error.visible {
            display: flex;
        }

        .login-footer {
            margin-top: var(--space-8);
            text-align: center;
            font-size: var(--text-xs);
            color: var(--color-text-muted);
        }

        /* Spinner de carga */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {
            .login-page {
                grid-template-columns: 1fr;
            }

            .login-hero {
                display: none;
            }

            .login-panel {
                padding: var(--space-8) var(--space-6);
            }
        }
    </style>
</head>

<body>

    <div class="login-page">

        <!-- Panel Izquierdo: Marca -->
        <div class="login-hero">
            <div class="hero-bubbles">
                <div class="hero-bubble hero-bubble-1"></div>
                <div class="hero-bubble hero-bubble-2"></div>
                <div class="hero-bubble hero-bubble-3"></div>
                <div class="hero-bubble hero-bubble-4"></div>
            </div>

            <div class="hero-logo-wrapper">
                <!-- Reemplazar src con la ruta real del logo cuando esté disponible -->
                <!-- <img class="hero-logo" src="../assets/img/logo.png" alt="Mi Primer ABC" /> -->
                <div class="hero-logo-placeholder"><img class="hero-logo" src="../assets/img/logo.png"
                        alt="Mi Primer ABC" /></div>
            </div>

            <div class="hero-content">
                <h1 class="hero-title">Mi Primer ABC</h1>
                <p class="hero-subtitle">Sistema de Control Escolar para el Jardín de Niños</p>
            </div>

            <div class="hero-grades">
                <div class="hero-grade-pill">
                    <div class="hero-grade-dot" style="background: var(--color-maternal);"></div>
                    Maternal
                </div>
                <div class="hero-grade-pill">
                    <div class="hero-grade-dot" style="background: var(--color-kinder1);"></div>
                    Kínder 1
                </div>
                <div class="hero-grade-pill">
                    <div class="hero-grade-dot" style="background: var(--color-kinder2);"></div>
                    Kínder 2
                </div>
                <div class="hero-grade-pill">
                    <div class="hero-grade-dot" style="background: var(--color-kinder3);"></div>
                    Kínder 3
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Formulario -->
        <div class="login-panel">
            <div class="login-form-container">

                <div class="login-form-header">
                    <h2 class="login-form-title">Bienvenida 👋</h2>
                    <p class="login-form-subtitle">Inicia sesión para acceder al sistema de control escolar.</p>
                </div>

                <div class="login-error" id="loginError">
                    ⚠️ <span id="loginErrorMsg">Correo o contraseña incorrectos.</span>
                </div>

                <form class="login-form" id="loginForm" autocomplete="off">

                    <div class="form-group">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input class="form-control" type="email" id="email" name="email"
                                placeholder="directora@miprimerabc.mx" required autocomplete="email" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input class="form-control" type="password" id="password" name="password"
                                placeholder="••••••••" required autocomplete="current-password" />
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="btnLogin">
                        <div class="spinner"></div>
                        <span class="btn-text">Ingresar al sistema</span>
                    </button>

                </form>

                <div class="login-footer">
                    Mi Primer ABC — Sistema de Control Escolar &copy; 2025
                </div>

            </div>
        </div>

    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Verificar si ya hay sesión activa
        Auth.checkSession();

        // Manejar el submit del formulario
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnLogin');
            const error = document.getElementById('loginError');
            const errMsg = document.getElementById('loginErrorMsg');
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;

            // UI: estado de carga
            btn.disabled = true;
            btn.classList.add('loading');
            error.classList.remove('visible');

            try {
                await Auth.login(email, pass);
                // Redirigir al dashboard tras login exitoso
                window.location.href = 'pages/dashboard.html';
            } catch (err) {
                errMsg.textContent = 'Correo o contraseña incorrectos. Por favor verifica tus datos.';
                error.classList.add('visible');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        });
    </script>

</body>

</html>
